<div class="top"><div class="wrap"><span>📍 Київ · Доставка по всій Україні</span><span>☎ {{ SHOP.phone }} (безкоштовно) · Пн–Нд 9:00–18:00</span></div></div>
<header class="main"><div class="wrap">
  <a class="logo" href="{% url 'index' %}">{{ SHOP.name }}</a>
  <form class="search" action="{% url 'catalog' %}" method="get">
    <input name="q" value="{{ q|default:'' }}" placeholder="Пошук товарів…" aria-label="Пошук">
    <button type="submit">Знайти</button>
  </form>
  <div class="icons">
    <a class="ibtn" href="{% url 'cart' %}">🛒 <span class="t">Кошик</span>{% if cart_count %}<span class="badge">{{ cart_count }}</span>{% endif %}</a>
  </div>
</div></header>
<nav class="cats"><div class="wrap">
  <a class="sale" href="{% url 'catalog' %}?sale=1">SALE</a>
  {% for c in menu_categories %}<a href="{{ c.get_absolute_url }}">{{ c.name }}</a>{% endfor %}
</div></nav>
